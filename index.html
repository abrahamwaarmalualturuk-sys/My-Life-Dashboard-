<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Life Dashboard</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e5eaf2;--nav:#0b1f3a;--accent:#2563eb;--accent2:#0ea5e9;--danger:#dc2626;--ok:#16a34a;--shadow:0 8px 28px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--nav);color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:10}.brand{font-weight:800;letter-spacing:.4px;font-size:18px}.brand small{display:block;color:#a9bdd8;font-weight:500;margin-top:4px}.nav{margin-top:28px;display:grid;gap:6px}.nav button{background:transparent;color:#c9d6e8;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:#17345c;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;background:#e9eef7;color:var(--text)}.btn.primary{background:var(--accent);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;align-items:center}.stat b{font-size:28px}.muted{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-title h2{font-size:18px;margin:0}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#edf2f7;font-size:12px}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.progress{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.item-title{font-weight:700}.search{width:280px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:14px}.empty{text-align:center;padding:36px;color:var(--muted)}.mobilebar{display:none}.modal{position:fixed;inset:0;background:rgba(2,8,23,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:100px;resize:vertical}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.close{background:#eef2f7;border-radius:8px;padding:7px 10px}.footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0;width:100%;padding:18px 14px 80px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--nav);z-index:20;padding:8px;justify-content:space-around}.mobilebar button{background:transparent;color:#dbe7f5;font-size:11px;padding:5px}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.search{width:100%}.top{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">MY LIFE DASHBOARD<small>Plan • Track • Grow</small></div><div class="nav" id="nav"></div></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><p id="dateLine"></p></div><div class="actions"><input class="search" id="globalSearch" placeholder="Search tasks, goals, projects, notes..."><button class="btn primary" onclick="openModal('task')">+ Task</button></div></div><div id="content"></div><div class="footer">My Life Dashboard • Data is stored locally in this browser</div></main>
<div class="mobilebar" id="mobileNav"></div>
</div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">✕</button></div><form id="form"></form></div></div>
<script>
const areas=['University & Study','Career & Jobs','Businesses & Organisations','Programming & Digital Skills','Social Media & Content','Finance & Business Planning','Documents & Projects','Personal Development'];
const nav=['Dashboard','Today','Tasks','Goals','Calendar','Projects','Notes','Areas','Documents','Settings'];
const seed={tasks:[
{id:1,title:'Complete Digital Systems assignment',area:'University & Study',priority:'High',status:'In Progress',due:'2026-10-03',notes:''},
{id:2,title:'Study Electromagnetic Theory',area:'University & Study',priority:'Medium',status:'Not Started',due:'2026-10-05',notes:''},
{id:3,title:'Update CV',area:'Career & Jobs',priority:'High',status:'Not Started',due:'2026-10-04',notes:''},
{id:4,title:'Plan SSYDIO monthly social media content',area:'Businesses & Organisations',priority:'Medium',status:'In Progress',due:'2026-10-06',notes:''},
{id:5,title:'Update KUOY AGRISOL LTD company profile',area:'Businesses & Organisations',priority:'High',status:'Not Started',due:'2026-10-08',notes:''},
{id:6,title:'Continue C++ learning',area:'Programming & Digital Skills',priority:'Medium',status:'In Progress',due:'2026-10-07',notes:''}],goals:[
{id:1,title:'Build my personal productivity system',area:'Personal Development',target:'2026-12-31',progress:35,status:'Active',notes:''},
{id:2,title:'Develop SSYDIO programmes and content',area:'Businesses & Organisations',target:'2026-12-15',progress:25,status:'Active',notes:''},
{id:3,title:'Improve programming skills',area:'Programming & Digital Skills',target:'2026-12-31',progress:30,status:'Active',notes:''}],projects:[
{id:1,title:'My Life Dashboard',area:'Programming & Digital Skills',status:'Active',priority:'High',progress:55,start:'2026-10-02',deadline:'2026-10-20',description:'Personal command center for goals, tasks, projects and notes.',notes:''},
{id:2,title:'SSYDIO Development & Content Plan',area:'Businesses & Organisations',status:'Planning',priority:'High',progress:20,start:'2026-10-01',deadline:'2026-11-15',description:'Plan programmes, partnerships, content and opportunities.',notes:''},
{id:3,title:'KUOY AGRISOL LTD Business Development',area:'Businesses & Organisations',status:'Planning',priority:'High',progress:15,start:'2026-10-01',deadline:'2026-12-01',description:'Develop company documents, proposals and funding research.',notes:''}],deadlines:[
{id:1,title:'Digital Systems assignment',date:'2026-10-03',time:'10:00',area:'University & Study',project:'',priority:'High'},
{id:2,title:'Update CV and applications',date:'2026-10-04',time:'18:00',area:'Career & Jobs',project:'',priority:'Medium'},
{id:3,title:'SSYDIO content plan',date:'2026-10-06',time:'17:00',area:'Businesses & Organisations',project:'SSYDIO Development & Content Plan',priority:'High'}],notes:[
{id:1,title:'SSYDIO ideas',content:'Youth development, innovation, skills, entrepreneurship, leadership, education and community engagement.',category:'SSYDIO',area:'Businesses & Organisations',date:'2026-10-02'},
{id:2,title:'Study plan',content:'Keep university work organized by course and deadline.',category:'University',area:'University & Study',date:'2026-10-02'}],documents:[]};
let db=JSON.parse(localStorage.getItem('lifeDashboard'))||seed;let page='Dashboard';let editId=null;
function save(){localStorage.setItem('lifeDashboard',JSON.stringify(db))}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){if(!d)return '—';return new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function badge(v){let c=v==='Completed'?'ok':(v==='Overdue'||v==='Urgent'?'bad':(v==='High'||v==='In Progress'?'warn':''));return '<span class="pill '+c+'">'+esc(v)+'</span>'}
function init(){nav.forEach(n=>{document.getElementById('nav').innerHTML+=`<button data-page="${n}">${icon(n)} ${n}</button>`;document.getElementById('mobileNav').innerHTML+=`<button data-page="${n}">${icon(n)}<br>${n}</button>`});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('globalSearch').oninput=render;document.getElementById('dateLine').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});render()}
function icon(n){return ({Dashboard:'⌂',Today:'✓',Tasks:'☑',Goals:'◎',Calendar:'▣',Projects:'▤',Notes:'✎',Areas:'◈',Documents:'▧',Settings:'⚙'})[n]||'•'}
function go(n){page=n;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===n));document.getElementById('pageTitle').textContent=n;render()}
function render(){let q=document.getElementById('globalSearch').value.toLowerCase();let c=document.getElementById('content');if(q){c.innerHTML=searchAll(q);return}if(page==='Dashboard')c.innerHTML=dashboard();else if(page==='Today')c.innerHTML=todayPage();else if(page==='Tasks')c.innerHTML=tasksPage();else if(page==='Goals')c.innerHTML=goalsPage();else if(page==='Calendar')c.innerHTML=calendarPage();else if(page==='Projects')c.innerHTML=projectsPage();else if(page==='Notes')c.innerHTML=notesPage();else if(page==='Areas')c.innerHTML=areasPage();else if(page==='Documents')c.innerHTML=documentsPage();else c.innerHTML=settingsPage()}
function dashboard(){let active=db.tasks.filter(x=>x.status!=='Completed'),done=db.tasks.filter(x=>x.status==='Completed').length,over=db.tasks.filter(x=>x.due&&x.due<today()&&x.status!=='Completed').length,due=db.tasks.filter(x=>x.due===today()&&x.status!=='Completed').length;return `
<div class="grid stats"><div class="card stat"><div><span class="muted">Active Tasks</span><br><b>${active.length}</b></div><span>☑</span></div><div class="card stat"><div><span class="muted">Completed</span><br><b>${done}</b></div><span>✓</span></div><div class="card stat"><div><span class="muted">Overdue</span><br><b>${over}</b></div><span>!</span></div><div class="card stat"><div><span class="muted">Due Today</span><br><b>${due}</b></div><span>◷</span></div></div>
<div class="section-title"><h2>Today's Focus</h2><button class="btn primary" onclick="openModal('task')">+ Add Task</button></div>
<div class="grid cards"><div class="card"><div class="item-row"><div><div class="item-title">Priority 1</div><span class="muted">Choose your most important task</span></div><span>1</span></div></div><div class="card"><div class="item-row"><div><div class="item-title">Priority 2</div><span class="muted">Move a key task forward</span></div><span>2</span></div></div></div>
<div class="section-title"><h2>Goal Progress</h2><button class="btn" onclick="openModal('goal')">+ Goal</button></div><div class="grid cards">${db.goals.slice(0,4).map(g=>`<div class="card"><div class="item-row"><b>${esc(g.title)}</b>${badge(g.status)}</div><p class="muted">${esc(g.area)} • target ${fmt(g.target)}</p><div class="progress"><span style="width:${g.progress}%"></span></div><small>${g.progress}% complete</small></div>`).join('')}</div>
<div class="section-title"><h2>Upcoming Deadlines</h2><button class="btn" onclick="openModal('deadline')">+ Deadline</button></div><div class="card">${db.deadlines.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(d=>`<div class="item"><div class="item-row"><div><div class="item-title">${esc(d.title)}</div><span class="muted">${fmt(d.date)} at ${esc(d.time||'—')}</span></div>${badge(d.priority)}</div></div>`).join('')||'<div class="empty">No deadlines yet.</div>'}</div>
<div class="section-title"><h2>Active Projects</h2><button class="btn" onclick="openModal('project')">+ Project</button></div><div class="grid cards">${db.projects.filter(p=>p.status!=='Completed').map(p=>`<div class="card"><div class="item-row"><b>${esc(p.title)}</b>${badge(p.status)}</div><p class="muted">${esc(p.area)} • deadline ${fmt(p.deadline)}</p><div class="progress"><span style="width:${p.progress}%"></span></div><small>${p.progress}% complete</small></div>`).join('')}</div>`}
function todayPage(){let ts=db.tasks.filter(t=>t.due===today()||(!t.due&&t.status!=='Completed'));return `<div class="card"><h2>Today's Plan</h2><p class="muted">${fmt(today())}</p>${ts.length?ts.map(taskRow).join(''):'<div class="empty">No tasks for today. Add one to get started.</div>'}</div><div class="section-title"><h2>Today's Deadlines</h2></div><div class="card">${db.deadlines.filter(d=>d.date===today()).map(d=>`<div class="item"><b>${esc(d.title)}</b><div class="muted">${esc(d.time||'')} • ${esc(d.area)}</div></div>`).join('')||'<div class="empty">Nothing due today.</div>'}</div>`}
function taskRow(t){return `<div class="item"><div class="item-row"><div><div class="item-title" style="${t.status==='Completed'?'text-decoration:line-through':''}">${esc(t.title)}</div><span class="muted">${esc(t.area)} • due ${fmt(t.due)}</span></div><div class="actions"><button class="btn" onclick="toggleTask(${t.id})">${t.status==='Completed'?'Reopen':'Complete'}</button><button class="btn" onclick="openModal('task',${t.id})">Edit</button></div></div></div>`}
function tasksPage(){return `<div class="section-title"><h2>Tasks</h2><button class="btn primary" onclick="openModal('task')">+ Add Task</button></div><div class="card"><div class="actions" style="margin-bottom:10px"><button class="btn" onclick="taskFilter='all';render()">All</button><button class="btn" onclick="taskFilter='today';render()">Today</button><button class="btn" onclick="taskFilter='overdue';render()">Overdue</button><button class="btn" onclick="taskFilter='completed';render()">Completed</button></div>${(db.tasks.filter(t=>{let f=window.taskFilter||'all';return f==='all'||(f==='today'&&t.due===today())||(f==='overdue'&&t.due<today()&&t.status!=='Completed')||(f==='completed'&&t.status==='Completed')})).map(taskRow).join('')||'<div class="empty">No matching tasks.</div>'}</div>`}
function goalsPage(){return `<div class="section-title"><h2>Goals</h2><button class="btn primary" onclick="openModal('goal')">+ Add Goal</button></div><div class="grid cards">${db.goals.map(g=>`<div class="card"><div class="item-row"><b>${esc(g.title)}</b>${badge(g.status)}</div><p class="muted">${esc(g.area)} • target ${fmt(g.target)}</p><div class="progress"><span style="width:${g.progress}%"></span></div><div class="item-row" style="margin-top:10px"><span>${g.progress}%</span><div class="actions"><button class="btn" onclick="openModal('goal',${g.id})">Edit</button><button class="btn danger" onclick="del('goals',${g.id})">Delete</button></div></div></div>`).join('')||'<div class="card empty">No goals yet.</div>'}</div>`}
function calendarPage(){return `<div class="section-title"><h2>Deadlines</h2><button class="btn primary" onclick="openModal('deadline')">+ Add Deadline</button></div><div class="card"><table class="table"><thead><tr><th>Title</th><th>Date</th><th>Area</th><th>Priority</th><th></th></tr></thead><tbody>${db.deadlines.sort((a,b)=>a.date.localeCompare(b.date)).map(d=>`<tr><td><b>${esc(d.title)}</b><br><small class="muted">${esc(d.time||'')}</small></td><td>${fmt(d.date)}</td><td>${esc(d.area)}</td><td>${badge(d.priority)}</td><td><button class="btn" onclick="openModal('deadline',${d.id})">Edit</button> <button class="btn danger" onclick="del('deadlines',${d.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function projectsPage(){return `<div class="section-title"><h2>Projects</h2><button class="btn primary" onclick="openModal('project')">+ Add Project</button></div><div class="grid cards">${db.projects.map(p=>`<div class="card"><div class="item-row"><b>${esc(p.title)}</b>${badge(p.status)}</div><p class="muted">${esc(p.area)} • ${esc(p.priority)} priority</p><div class="progress"><span style="width:${p.progress}%"></span></div><p><b>${p.progress}%</b> • deadline ${fmt(p.deadline)}</p><div class="actions"><button class="btn" onclick="openModal('project',${p.id})">Edit</button><button class="btn danger" onclick="del('projects',${p.id})">Delete</button></div></div>`).join('')}</div>`}
function notesPage(){return `<div class="section-title"><h2>Notes</h2><button class="btn primary" onclick="openModal('note')">+ Add Note</button></div><div class="grid cards">${db.notes.map(n=>`<div class="card"><div class="item-row"><b>${esc(n.title)}</b><span class="pill">${esc(n.category)}</span></div><p>${esc(n.content)}</p><small class="muted">${fmt(n.date)} • ${esc(n.area)}</small><div class="actions" style="margin-top:10px"><button class="btn" onclick="openModal('note',${n.id})">Edit</button><button class="btn danger" onclick="del('notes',${n.id})">Delete</button></div></div>`).join('')||'<div class="card empty">No notes yet.</div>'}</div>`}
function areasPage(){return `<div class="grid cards">${areas.map(a=>{let t=db.tasks.filter(x=>x.area===a).length,g=db.goals.filter(x=>x.area===a).length,p=db.projects.filter(x=>x.area===a).length;return `<div class="card"><b>${a}</b><p class="muted">${t} tasks • ${g} goals • ${p} projects</p><button class="btn" onclick="document.getElementById('globalSearch').value='${a}';render()">View related</button></div>`}).join('')}</div>`}
function documentsPage(){return `<div class="section-title"><h2>Documents & Projects</h2><button class="btn primary" onclick="openModal('document')">+ Add Document</button></div><div class="card">${db.documents.map(d=>`<div class="item"><div class="item-row"><div><b>${esc(d.title)}</b><div class="muted">${esc(d.type)} • ${esc(d.area)} • deadline ${fmt(d.deadline)}</div></div>${badge(d.status)}</div><div class="actions" style="margin-top:8px"><button class="btn" onclick="openModal('document',${d.id})">Edit</button><button class="btn danger" onclick="del('documents',${d.id})">Delete</button></div></div>`).join('')||'<div class="empty">No documents tracked yet.</div>'}</div>`}
function settingsPage(){return `<div class="grid cards"><div class="card"><h2>Profile</h2><p class="muted">Your dashboard identity</p><div class="field"><label>Name</label><input id="profileName" value="${esc(localStorage.getItem('profileName')||'Abraham Waar')}"></div><button class="btn primary" style="margin-top:10px" onclick="localStorage.setItem('profileName',document.getElementById('profileName').value);alert('Profile saved')">Save</button></div><div class="card"><h2>Data</h2><p class="muted">Your data is stored in this browser.</p><button class="btn" onclick="exportData()">Export JSON</button> <button class="btn danger" onclick="if(confirm('Reset all dashboard data to demo data?')){db=JSON.parse(JSON.stringify(seed));save();render()}">Reset demo data</button></div></div>`}
function searchAll(q){let out=[];['tasks','goals','projects','notes','deadlines','documents'].forEach(k=>(db[k]||[]).forEach(x=>{let s=JSON.stringify(x).toLowerCase();if(s.includes(q))out.push(`<div class="item"><b>${esc(x.title||x.name)}</b><div class="muted">${esc(k)} • ${esc(x.area||'')}</div></div>`)}));return '<div class="card"><h2>Search results</h2>'+(out.join('')||'<div class="empty">No results found.</div>')+'</div>'}
function openModal(type,id=null){editId=id;let x=id?(db[type+'s']||[]).find(a=>a.id===id):null;let title={task:'Task',goal:'Goal',project:'Project',deadline:'Deadline',note:'Note',document:'Document'}[type];document.getElementById('modalTitle').textContent=(id?'Edit ':'Add ')+title;let f=document.getElementById('form');let A=areas.map(a=>`<option ${x&&x.area===a?'selected':''}>${a}</option>`).join('');let h='';if(type==='task')h=`<div class="formgrid"><div class="field full"><label>Title</label><input name="title" required value="${esc(x?.title||'')}"></div><div class="field"><label>Area</label><select name="area">${A}</select></div><div class="field"><label>Priority</label><select name="priority">${['Low','Medium','High','Urgent'].map(v=>`<option ${x?.priority===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['Not Started','In Progress','Completed'].map(v=>`<option ${x?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Due date</label><input type="date" name="due" value="${x?.due||''}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(x?.notes||'')}</textarea></div></div>`;else if(type==='goal')h=`<div class="formgrid"><div class="field full"><label>Goal title</label><input name="title" required value="${esc(x?.title||'')}"></div><div class="field"><label>Area</label><select name="area">${A}</select></div><div class="field"><label>Target date</label><input type="date" name="target" value="${x?.target||''}"></div><div class="field"><label>Progress %</label><input type="number" min="0" max="100" name="progress" value="${x?.progress??0}"></div><div class="field"><label>Status</label><select name="status">${['Active','Completed','Paused'].map(v=>`<option ${x?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(x?.notes||'')}</textarea></div></div>`;else if(type==='project')h=`<div class="formgrid"><div class="field full"><label>Project name</label><input name="title" required value="${esc(x?.title||'')}"></div><div class="field"><label>Area</label><select name="area">${A}</select></div><div class="field"><label>Status</label><select name="status">${['Planning','Active','On Hold','Completed'].map(v=>`<option ${x?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select name="priority">${['Low','Medium','High'].map(v=>`<option ${x?.priority===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Progress %</label><input type="number" min="0" max="100" name="progress" value="${x?.progress??0}"></div><div class="field"><label>Start date</label><input type="date" name="start" value="${x?.start||''}"></div><div class="field"><label>Deadline</label><input type="date" name="deadline" value="${x?.deadline||''}"></div><div class="field full"><label>Description</label><textarea name="description">${esc(x?.description||'')}</textarea></div></div>`;else if(type==='deadline')h=`<div class="formgrid"><div class="field full"><label>Title</label><input name="title" required value="${esc(x?.title||'')}"></div><div class="field"><label>Date</label><input type="date" name="date" required value="${x?.date||''}"></div><div class="field"><label>Time</label><input type="time" name="time" value="${x?.time||''}"></div><div class="field"><label>Area</label><select name="area">${A}</select></div><div class="field"><label>Priority</label><select name="priority">${['Low','Medium','High'].map(v=>`<option ${x?.priority===v?'selected':''}>${v}</option>`).join('')}</select></div></div>`;else if(type==='note')h=`<div class="formgrid"><div class="field full"><label>Title</label><input name="title" required value="${esc(x?.title||'')}"></div><div class="field"><label>Category</label><input name="category" value="${esc(x?.category||'General')}"></div><div class="field"><label>Area</label><select name="area">${A}</select></div><div class="field full"><label>Content</label><textarea name="content" required>${esc(x?.content||'')}</textarea></div></div>`;else h=`<div class="formgrid"><div class="field full"><label>Document name</label><input name="title" required value="${esc(x?.title||'')}"></div><div class="field"><label>Type</label><input name="type" value="${esc(x?.type||'Report')}"></div><div class="field"><label>Area</label><select name="area">${A}</select></div><div class="field"><label>Status</label><select name="status">${['Draft','In Progress','Completed','Submitted','Archived'].map(v=>`<option ${x?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Deadline</label><input type="date" name="deadline" value="${x?.deadline||''}"></div></div>`;f.innerHTML=h+`<div class="actions" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div>`;f.onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(f).entries());['progress'].forEach(k=>{if(data[k]!==undefined)data[k]=Number(data[k])});let key=type+'s';if(!db[key])db[key]=[];if(id){let i=db[key].findIndex(a=>a.id===id);db[key][i]={...db[key][i],...data}}else{data.id=Date.now();if(type==='note')data.date=today();db[key].push(data)}save();closeModal();render()};document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toggleTask(id){let t=db.tasks.find(x=>x.id===id);if(t){t.status=t.status==='Completed'?'Not Started':'Completed';save();render()}}
function del(key,id){if(confirm('Delete this item?')){db[key]=db[key].filter(x=>x.id!==id);save();render()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='my-life-dashboard-data.json';a.click()}
init();
</script>
